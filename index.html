    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120e18;
        color: #f6f0e6;
        font-family: "Sora", "Trebuchet MS", sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      canvas#world {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="world"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
